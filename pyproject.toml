[tool.poetry]
name = "fastorm"
version = "0.1.0"
description = ""  # Optionally fill from README.md
authors = ["luckydonald <fastorm+code@luckydonald.de>"]
license = "MIT"
homepage = "https://github.com/luckydonald/fastorm"
readme = "README.md"
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
#    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
#    "Programming Language :: Python :: 3.8",
#    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
#    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
#    "Topic :: Internet :: WWW/HTTP",
]

[tool.poetry.dependencies]
python = ">=3.10.0"
asyncpg = "*"
luckydonald-utils = ">=0.83"
typeguard = "*"
pydantic = "^2.0.0"

[tool.poetry.extras]
test = []

[tool.poetry.urls]
Documentation = "https://github.com/luckydonald/fastorm"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"